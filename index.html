  /* ===== 지도 그리기: OpenStreetMap 데이터(건물 윤곽, 녹지, 하천, 도로)로 직접 그린다 ===== */
  var PCOL={eat:"#f0532d",cafe:"#8a5a3b",conv:"#1f9d55",print:"#7552d0",meal:"#e08a00",pub:"#4f6480",laundry:"#2f86c2",pc:"#4f6480",karaoke:"#4f6480",spot:"#2e9e6b"};
  var PICO={eat:"eat",cafe:"cafe",conv:"conv",print:"print",meal:"eat",pub:"pub",laundry:"laundry",pc:"pc",karaoke:"pc",spot:"spot"};
  var PNAME={eat:"밥집",meal:"학생식당",cafe:"카페",conv:"편의점",print:"프린트"};
  function vb(){var h=MV.w*MAPR;return (MV.x-MV.w/2)+" "+(MV.y-h/2)+" "+MV.w+" "+h}
  function pd(p,z){var s="M"+p[0]+" "+p[1];for(var i=2;i<p.length;i+=2)s+="L"+p[i]+" "+p[i+1];return s+(z?"Z":"")}
  function baseSvg(){
    if(ROADSVG)return ROADSVG;
    var h='<rect x="-5000" y="-5000" width="10000" height="10000" class="m-bg"/><path class="m-campus" fill-rule="evenodd" d="'+CAMPUSP.map(function(p){return pd(p,1)}).join("")+'"/>';
    var cls={g:"m-green",w:"m-wood",f:"m-farm",a:"m-water",p:"m-pitch",B:"m-bldg",U:"m-ubldg"},bl="";
    POLYS.forEach(function(p){var s='<path class="'+cls[p[0]]+'" d="'+pd(p[1],1)+'"/>';if(p[0]==="B"||p[0]==="U")bl+=s;else h+=s});
    var sty={W:["water",6,0],F:["foot",1.6,0],S:["minor",5,1],R:["minor",7,1],M:["major",12,1]},edge="",fill="",defs="",n=0,best={};
    ["W","F","S","R","M"].forEach(function(k){ROADS.forEach(function(r){
      if(r[0]!==k)return;var s=sty[k],d=pd(r[2]);
      if(s[2])edge+='<path d="'+d+'" class="r-edge'+(k==="M"?" r-medge":"")+'" stroke-width="'+(s[1]+2.5)+'"/>';
      fill+='<path d="'+d+'" class="r-'+s[0]+'" stroke-width="'+s[1]+'"/>';
      if(r[1]&&k!=="F"&&k!=="S"){var L=0;for(var i=2;i<r[2].length;i+=2)L+=Math.hypot(r[2][i]-r[2][i-2],r[2][i+1]-r[2][i-1]);if(!best[r[1]]||best[r[1]].L<L)best[r[1]]={L:L,p:r[2]}}
    })});
    Object.keys(best).forEach(function(nm){var b=best[nm];if(b.L<120)return;var p=b.p;if(p[0]>p[p.length-2]){var q=[];for(var i=p.length-2;i>=0;i-=2)q.push(p[i],p[i+1]);p=q}defs+='<path id="rl'+n+'" d="'+pd(p)+'"/>';RLAB.push(["rl"+n,nm]);n++});
    ROADSVG=h+'<g fill="none" stroke-linecap="round" stroke-linejoin="round">'+edge+fill+'</g>'+bl+'<defs>'+defs+'</defs>';
    return ROADSVG;
  }
  function bxy(code){for(var i=0;i<BLDXY.length;i++)if(BLDXY[i][0]===code)return [BLDXY[i][2],BLDXY[i][3]];if(code==="E8-1"){var e=bxy("E8");return e?[e[0]+24,e[1]+20]:null}return null}
  /* 같은 건물 안 시설은 건물 위치 둘레에 나눠 찍는다 */
  (function(){var g={};ITEMS.forEach(function(i){if(!i.pos&&i.bldg){(g[i.bldg]=g[i.bldg]||[]).push(i)}});
    Object.keys(g).forEach(function(b){var c=bxy(b);if(!c)return;var l=g[b];l.forEach(function(i,n){var a=n*2*Math.PI/l.length-Math.PI/2,r=l.length>1?16:0;i.pos=[Math.round(c[0]+r*Math.cos(a)),Math.round(c[1]+r*Math.sin(a))]})});})();
  function shortName(n){return n.replace(/\s*(충주)?(한국)?교통대(점|학교점)?$/,"").replace(/\s*충주교통대점$/,"")||n}
  function overlay(list){
    var k=MV.w/300,h="",near=MV.w<=560,seen={},last="";
    RLAB.forEach(function(r){h+='<text class="r-lab" font-size="'+(9*k)+'" stroke-width="'+(3*k)+'"><textPath href="#'+r[0]+'" startOffset="50%" text-anchor="middle">'+esc(r[1])+'</textPath></text>'});
    BLDXY.forEach(function(b){var key=b[0]+b[1];if(seen[key])return;seen[key]=1;
      h+='<g class="m-bl" data-b="'+(BMAP[b[0]]?b[0]:"")+'" transform="translate('+b[2]+' '+b[3]+')"><text font-size="'+(9.5*k)+'" stroke-width="'+(3*k)+'"><tspan class="m-code">'+b[0]+'</tspan>'+(MV.w<=1000?'<tspan dx="'+(2*k)+'">'+esc(b[1])+'</tspan>':'')+'</text></g>'});
    STOPS.forEach(function(s){h+='<g transform="translate('+s[0]+' '+s[1]+')"><rect x="'+(-5*k)+'" y="'+(-5*k)+'" width="'+(10*k)+'" height="'+(10*k)+'" rx="'+(2*k)+'" class="m-stop"/><text y="'+(15*k)+'" class="m-stoplab" font-size="'+(7*k)+'">정류장</text></g>'});
    list.forEach(function(it){
      if(!it.pos)return;var on=S.sel===it.name,st=status(it),off=st&&!st.live,r=(on?13:10)*k,col=off?"#9aa3ad":(PCOL[it.cat]||"#4f6480");
      var g='<g class="pin'+(on?" on":"")+'" data-pin="'+esc(it.name)+'" transform="translate('+it.pos[0]+' '+it.pos[1]+')"><title>'+esc(it.name)+'</title><circle r="'+r+'" style="fill:'+col+'"/><g class="pin-ic" transform="translate('+(-r*0.62)+' '+(-r*0.62)+') scale('+(r*1.24/24)+')">'+P[PICO[it.cat]||"pin"]+'</g>'+((near||on)?'<text y="'+(r+11*k)+'" font-size="'+(10*k)+'" stroke-width="'+(3*k)+'">'+esc(shortName(it.name))+'</text>':'')+'</g>';
      if(on)last=g;else h+=g;
    });
    return h+last;
  }
  function mapHtml(list,key){

    var cats={};list.forEach(function(i){if(i.pos)cats[i.cat]=1});
    return '<div class="map"><svg id="msvg" viewBox="'+vb()+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="교통대 캠퍼스와 대학가 지도"><g id="mbase">'+baseSvg()+'</g><g id="mover">'+overlay(list)+'</g></svg>'+

      '<div class="legend">'+Object.keys(cats).map(function(c){return '<span><i style="background:'+(PCOL[c]||"#4f6480")+'"></i>'+(PNAME[c]||CAT[c])+'</span>'}).join("")+'<span><i style="background:#9aa3ad"></i>지금 영업 안 함</span><span><i style="background:var(--m-ubldg);border-radius:2px"></i>학교 건물</span></div>'+
      '<p class="src" style="margin-top:4px">지도 데이터 © OpenStreetMap 기여자 · 밥집 위치는 네이버 지도 공유 링크, 캠퍼스 시설은 건물 위치 기준이에요</p>';
  }
  function mapAndSel(f,key){
    var sel=f.filter(function(i){return i.name===S.sel})[0];
    return mapHtml(f,key)+(sel?'<div class="group selcard">'+placeRow(sel,true,0,true)+'</div>':'<p class="hint" style="margin-top:8px">지도에서 아이콘을 누르면 정보가 열리고, 건물 이름을 누르면 건물 안내가 열려요. 끌어서 움직이고 두 손가락이나 +/−로 확대해요.</p>');
  }
  function mapEl(){return document.getElementById("msvg")}
  function clampMV(){MV.w=Math.max(80,Math.min(1700,MV.w));MV.x=Math.max(-700,Math.min(800,MV.x));MV.y=Math.max(-1500,Math.min(500,MV.y))}
  function applyVB(){var s=mapEl();if(s)s.setAttribute("viewBox",vb())}
  function redrawMap(){var s=mapEl(),o=document.getElementById("mover");if(s&&o){o.innerHTML=overlay(MAPLIST);s.setAttribute("viewBox",vb())}}
  var GS=null,wheelT=null;
  document.addEventListener("pointerdown",function(e){
    var s=mapEl();if(!s||!s.contains(e.target))return;
    if(!GS)GS={p:{},moved:false};
    GS.p[e.pointerId]={x:e.clientX,y:e.clientY};GS.mv={x:MV.x,y:MV.y,w:MV.w};GS.st=JSON.parse(JSON.stringify(GS.p));
  });

    if(!GS||!GS.p[e.pointerId])return;var s=mapEl();if(!s)return;
    GS.p[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(GS.p),u=GS.mv.w/s.clientWidth;
    if(ids.length===1){var a=GS.st[ids[0]],b=GS.p[ids[0]];if(!a)return;var dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)+Math.abs(dy)>6)GS.moved=true;if(!GS.moved)return;MV.x=GS.mv.x-dx*u;MV.y=GS.mv.y-dy*u}
    else{var a0=GS.st[ids[0]],a1=GS.st[ids[1]],b0=GS.p[ids[0]],b1=GS.p[ids[1]];if(!a0||!a1)return;var d0=Math.hypot(a0.x-a1.x,a0.y-a1.y),d1=Math.hypot(b0.x-b1.x,b0.y-b1.y);if(d0>0&&d1>0){MV.w=GS.mv.w*d0/d1;GS.moved=true}}

  });
  function endGS(e){
    if(!GS||!GS.p[e.pointerId])return;delete GS.p[e.pointerId];
    if(Object.keys(GS.p).length){GS.mv={x:MV.x,y:MV.y,w:MV.w};GS.st=JSON.parse(JSON.stringify(GS.p));return}

  },{passive:false});

  function homeView(){

    if(ds.close){closeSheet();return}
    if(ds.b){buildingSheet(ds.b);return}
    if(ds.go){closeSheet();go(ds.go,ds.gc);return}
    if(ds.add){formSheet();return}
    if(ds.del){
      if(t.textContent!=="정말 삭제"){t.textContent="정말 삭제";return}
      publishTips(TIPS.filter(function(x){return x.id!==ds.del}));return;
    }
    if(t.classList.contains("copy-btn")){
      var v=ds.v,txt=t.textContent;
      var ok=function(){t.textContent="복사됨";setTimeout(function(){t.textContent=txt},1500)};
      var fb=function(){toast("복사가 막혀 있어요. 길게 눌러 직접 복사하세요: "+v.split("\n")[0])};
      try{navigator.clipboard.writeText(v).then(ok,fb)}catch(x){fb()}
      return;
    }
    if(ds.cat!=null){S.cat=ds.cat;S.zone="all";S.kind="all";S.late=false}
    if(ds.zone!=null)S.zone=ds.zone;
    if(ds.kind!=null){if(ds.kind==="late"){S.late=true;S.kind="all"}else{S.late=false;S.kind=ds.kind}}
    if(ds.sub!=null)S.sub=ds.sub;
    if(ds.bz!=null)S.bz=ds.bz;
    if(ds.asub!=null)S.asub=ds.asub;
    if(ds.tcat!=null)S.tcat=ds.tcat;
    render();
  });
  root.addEventListener("change",function(e){
    var i=e.target;
    if(i.dataset.todo){
      var l=todos(),td=today(),left;
      l.forEach(function(x){if(x.id===i.dataset.todo){x.done=i.checked;x.doneAt=i.checked?td:null}});
      store("ut-todo",l);left=l.filter(function(x){return !x.done&&x.date<=td}).length;
      if(i.checked)toast(left?"완료! 오늘 남은 할 일 "+left+"개":"오늘 할 일을 모두 끝냈어요.");
      render();return;
    }
    if(i.dataset.ck==null)return;
    var done=store("ut-check")||[],n=+i.dataset.ck,p=done.indexOf(n);
    if(i.checked&&p<0)done.push(n);if(!i.checked&&p>-1)done.splice(p,1);
    store("ut-check",done);render();
  });
  root.addEventListener("submit",function(e){
    var g=function(id){return document.getElementById(id).value.trim()};
    if(e.target.id==="todoquick"){e.preventDefault();var qt=g("tq-text");if(!qt){toast("할 일을 적어 주세요.");return}addTodo(qt,today(),"");render();return}
    if(e.target.id==="todoform"||e.target.id==="todoform2"){
      e.preventDefault();var p=e.target.id==="todoform"?"td":"tm",tx=g(p+"-text"),dt=g(p+"-date");
      if(!tx||!/^\d{4}-\d\d-\d\d$/.test(dt)){toast("할 일과 날짜를 적어 주세요.");return}
      addTodo(tx,dt,p==="td"?g("td-ref"):"");if(p==="td")closeSheet();render();return;
    }
    if(e.target.id==="hform"){
      e.preventDefault();
      var nmz=e.target.getAttribute("data-name"),days=[],bad=false;
      for(var k=0;k<7;k++){var v=g("hf-"+k).replace(/\s+/g,"").replace("~","-");if(!v)days.push(null);else if(v==="휴무"||RNG.test(v))days.push(v);else bad=true}
      var brk=g("hf-brk").replace(/\s+/g,"").replace("~","-"),lo=g("hf-lo").replace(/\s+/g,"");
      if(bad||(brk&&!RNG.test(brk))||(lo&&!/^\d\d:\d\d$/.test(lo))){toast("형식을 확인해 주세요. 예: 11:00-21:00, 휴무, 21:30");return}
      if(!days.some(function(x){return x})){toast("요일 중 하나 이상은 적어 주세요.");return}
      var nh=JSON.parse(JSON.stringify(HOV));nh[nmz]={days:days,brk:brk||null,lo:lo||null,d:today()};
      publishTips(TIPS,null,nh);return;
    }
    if(e.target.id==="ttform"){
      e.preventDefault();
      var c={id:"c"+Date.now().toString(36),day:+g("tt-day"),t:g("tt-t"),name:g("tt-name"),room:g("tt-room")};
      if(!/^\d\d:\d\d$/.test(c.t)||!c.name||!c.room){toast("요일, 시간, 과목, 강의실을 모두 적어 주세요.");return}
      store("ut-tt",(store("ut-tt")||[]).concat([c]));
      toast(roomBldg(c.room)?"추가했어요. "+roomBldg(c.room)+" "+bName(roomBldg(c.room))+"로 안내할게요.":"추가했어요. 건물 번호를 못 찾았어요. E14-205처럼 적어 주세요.");
      render();return;
    }
    if(e.target.id==="ddform"){
      e.preventDefault();
      var d={id:"d"+Date.now().toString(36),name:g("dd-name"),date:g("dd-date")};
      if(!d.name||!/^\d{4}-\d\d-\d\d$/.test(d.date)){toast("이름과 날짜를 적어 주세요.");return}
      store("ut-dd",(store("ut-dd")||[]).concat([d]));toast("D-day를 추가했어요.");render();return;
    }
    if(e.target.id!=="tipform")return;
    e.preventDefault();
    var tip={id:"t"+Date.now().toString(36),cat:g("tf-cat"),title:g("tf-title"),body:g("tf-body"),where:g("tf-where").toUpperCase().replace(/\s+/g,"")in BMAP?g("tf-where").toUpperCase().replace(/\s+/g,""):g("tf-where"),date:today(),src:g("tf-src")};
    if(!tip.title||!tip.body){toast("제목과 내용을 적어 주세요.");return}
    publishTips([tip].concat(TIPS),tip);
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!sheet.hidden)closeSheet()});
  window.addEventListener("hashchange",routeHash);

  render();
  routeHash();

  /* 운영진(이 앱을 고칠 수 있는 사람)에게만 꿀팁 추가·삭제를 보여 준다 */
  if(window.claude&&window.claude.use){
    window.claude.use("artifact").then(function(a){if(!a)return null;ART=a;return window.claude.use("user")})
    .then(function(u){return u?u.canEdit():false})
    .then(function(ok){
      if(!ok||!ART)return;
      ADMIN=true;render();
      var d=ss(DK);
      if(d){if(TIPS.some(function(t){return t.id===d.id}))ss(DK,null);else{formSheet(d);toast("저장하지 못한 꿀팁을 다시 불러왔어요.")}}
    }).catch(function(){});
  }
})();
</script>
