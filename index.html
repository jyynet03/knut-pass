<title>통통 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style id="css">
/* 레이아웃: 폰 한 손 앱. 흰 바탕, 큰 제목, 아이콘 퀵메뉴, 구분선 목록, 아래에서 올라오는 상세 시트, 하단 5칸 탭바. 강조색은 파랑 하나. */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --ink:#15191e; --muted:#6b7580; --line:#e6e9ee; --chip:#f0f2f5;
  --accent:#1d4fb8; --accent-soft:#e8eefb; --on-accent:#ffffff;
  --rail:#3d4450; --board:#0f1d33; --board-2:#1b2c4a; --led:#ffb21a; --sign-green:#0f7a4e; --sign-blue:#1d4fb8; --signal:#ffc21a; --asphalt:#3a3f47;
  --font-display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --l-home:#1d4fb8; --l-place:#0f9d58; --l-campus:#ef7d00; --l-board:#8a4fe0; --l-my:#e2414a; --ln:var(--l-home);
  --hero-sky:#e6f0ff; --hero-sky2:#f7fbff; --hero-mt:#c7dcc2; --hero-mt2:#aecaa8; --hero-bd:#d9dee8; --hero-win:#b9c7e6; --hero-gd:#eef0e4;
  --ok:#16794c; --ok-soft:#e5f4ec; --warn:#8a5200; --warn-soft:#fdf1dc; --scrim:rgba(15,20,25,.45);
  --map-bg:#f2f1ed; --road:#ffffff; --road-major:#ffe3a0; --road-edge:#d9d7d0; --road-major-e:#e6bf63; --water:#aed3f2; --foot:#cfccc4;
  --m-campus:#ece8f4; --m-green:#d5eac6; --m-wood:#c6e2b2; --m-farm:#ebf0dc; --m-pitch:#c9e6bd;
  --m-bldg:#e3e1dc; --m-bldg-e:#cfccc5; --m-ubldg:#d9d2ea; --m-ubldg-e:#b8acd6; --m-label:#5c5a55;
  --font:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding-inline:20px;padding-block:0 108px;word-break:keep-all}
.wrap{max-width:520px;margin-inline:auto}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:24px;height:24px;flex:none}

.head{padding-block:26px 12px}
.head h1{margin:0;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.02em}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px 10px}
.search{width:100%;padding:13px 16px;border:0;border-radius:14px;background:var(--chip);color:var(--ink);font:inherit;font-size:16px;min-height:48px}
.search::placeholder{color:var(--muted)}

h2{font-size:16px;font-weight:700;margin:0}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 8px;min-height:44px}
.more{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;min-height:44px;padding:0 4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;min-height:40px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;border:0;background:none;font-size:13px;font-weight:500;min-height:44px}
.qi{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}

.now{display:block;width:100%;text-align:left;margin-top:22px;border:0;border-radius:16px;background:var(--accent-soft);padding:16px}
.now small{display:block;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.04em}
.now b{display:block;font-size:17px;margin:2px 0 6px}
.now ul{margin:0;padding-left:18px;font-size:14px}
.now li+li{margin-top:2px}

.group{background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.group>*+*{border-top:1px solid var(--line)}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:60px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.main{flex:1;min-width:0}
.name{font-weight:700;overflow-wrap:anywhere;line-height:1.4}
.sub{color:var(--muted);font-size:13px;margin-top:1px;overflow-wrap:anywhere}
.st{flex:none;font-size:12px;font-weight:700;color:var(--warn);text-align:right;max-width:34%}
.st.live{color:var(--ok)}
.chev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .15s}
details[open] .chev{transform:rotate(180deg)}
.body{padding:0 16px 16px}
.note{margin:0 0 10px;font-size:15px}
.note.none{color:var(--muted)}
.addr{margin:0 0 12px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;min-width:120px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;text-decoration:none;padding:0 14px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn .ic{width:18px;height:18px}
.date{margin-top:10px;font-size:12px;color:var(--muted)}

.brow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;min-height:60px;border:0;background:none;text-align:left}
.code{flex:none;width:52px;font-weight:700;font-size:17px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.brow .chev{transform:rotate(-90deg)}
.chev2{width:18px;height:18px;flex:none;color:var(--muted)}
.linkbar{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;border:0;border-radius:16px;background:var(--chip);padding:14px 16px;text-align:left;min-height:60px}
.linkbar .ic{color:var(--accent)}
.linkbar .chev{transform:rotate(-90deg)}

.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 16px;font-size:15px}
.kv span:first-child{color:var(--muted);flex:none}
.kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.card{padding:16px}
.card h3{margin:0 0 4px;font-size:17px}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;vertical-align:2px;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-usual{background:var(--chip);color:var(--muted)}
.t-comm{background:var(--warn-soft);color:var(--warn)}

.mon{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 16px}
.mon>b{font-size:15px;font-variant-numeric:tabular-nums}
.mon.cur{background:var(--accent-soft)}
.mon.cur>b{color:var(--accent)}
.mon ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}

.tips{display:flex;flex-direction:column;gap:10px}
.tip{border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:16px}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.wlink{border:0;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;min-height:28px}
.tip h3{margin:0 0 4px;font-size:16px;line-height:1.4}
.tip p{margin:0;font-size:15px;color:var(--ink)}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.del{border:0;background:none;color:var(--warn);font-size:13px;font-weight:700;min-height:36px;padding:0 4px}

.check{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;min-height:52px}
.check input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--accent)}
.check label{flex:1;min-width:0;font-size:15px}
.check input:checked+label{color:var(--muted);text-decoration:line-through}

.irow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px}
.irow span{min-width:0;overflow-wrap:anywhere}
.irow small{display:block;color:var(--muted);font-size:12px}
.copy{flex:none;border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 14px;min-height:44px;font-size:14px;font-weight:700}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.foot{margin-top:28px;color:var(--muted);font-size:12px;line-height:1.7}
.addbtn{width:100%;margin-bottom:12px}

.sheet-wrap{position:fixed;inset:0;z-index:20}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin-inline:auto;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 20px calc(28px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.x{position:absolute;top:8px;right:10px;width:44px;height:44px;border:0;background:none;font-size:26px;line-height:1;color:var(--muted)}
.sh-code{font-size:30px;font-weight:700;color:var(--accent);letter-spacing:-.02em;line-height:1.1}
.sh-name{font-size:21px;font-weight:700;margin:2px 0 2px}
.sec{margin-top:20px}
.sec h4{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:700}
.dep{display:flex;flex-wrap:wrap;gap:6px}
.dep span{background:var(--chip);border-radius:10px;padding:6px 12px;font-size:14px}
.flist{margin:0;padding-left:18px;font-size:15px}
.flist li+li{margin-top:3px}
.src{margin-top:18px;font-size:12px;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:14px;font-weight:700}
.field input,.field select,.field textarea{width:100%;border:0;border-radius:12px;background:var(--chip);color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;min-height:48px}
.field textarea{min-height:120px;resize:vertical}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:14px;width:max-content;max-width:calc(100% - 32px)}

nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
:root[data-ut-theme="dark"]{color-scheme:dark;--bg:#0f1419;--surface:#161d25;--ink:#eef2f6;--muted:#94a1ae;--line:#26313d;--chip:#1f2833;--accent:#7db2ff;--accent-soft:#16304f;--on-accent:#0f1419;--ok:#5fd39b;--ok-soft:#123326;--warn:#f0b44c;--warn-soft:#3a2d10;--scrim:rgba(0,0,0,.6);--map-bg:#1a2028;--road:#2f3945;--road-major:#6b5626;--road-edge:#11161c;--road-major-e:#3d3115;--water:#1e3a55;--foot:#3a4654;--m-campus:#232338;--m-green:#1d3324;--m-wood:#1b3120;--m-farm:#1f2a22;--m-pitch:#1f3a26;--m-bldg:#2a313b;--m-bldg-e:#38404b;--m-ubldg:#353251;--m-ubldg-e:#4d4873;--m-label:#b9c2cc;--rail:#9aa4b2;--board:#0a1222;--board-2:#152440;--led:#ffbf3d;--sign-green:#1f9e69;--sign-blue:#3a6fd8;--signal:#ffcf4d;--asphalt:#2a2f36;--hero-sky:#13213a;--hero-sky2:#1c2f4f;--hero-mt:#1e3528;--hero-mt2:#264434;--hero-bd:#2b3546;--hero-win:#ffd36b;--hero-gd:#1a2027}
.today{border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.today .th{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px 2px 16px}
.today .th b{font-size:16px}
.cls{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px 16px;min-height:56px}
.cls .t{flex:none;width:48px;font-weight:700;font-variant-numeric:tabular-nums}
.cls.next{background:var(--accent-soft)}
.cls.next .t{color:var(--accent)}
.cls .chev{transform:rotate(-90deg)}
.dday{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:13px;border-radius:999px;padding:6px 14px;min-height:36px;margin-top:10px}
.pick{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);padding:14px 16px;min-height:62px;text-align:left}
.pick .sub{color:inherit;opacity:.85}
.lrow{display:flex;align-items:center}
.lrow>a{flex:1;min-width:0}
.starbtn{flex:none;width:48px;height:48px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.acts .starbtn{border-radius:12px;background:var(--chip);height:46px}
.starbtn[aria-pressed="true"]{color:#e8a200}
.starbtn .ic{width:22px;height:22px}
.starbtn[aria-pressed="true"] .ic{fill:currentColor}
.new{font-size:11px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:1px 8px}
.share{border:0;background:none;color:var(--accent);font-size:13px;font-weight:700;min-height:36px;padding:0 4px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.qr{display:grid;place-items:center;padding:14px;background:#ffffff;border-radius:16px;margin:14px auto 0;width:max-content}
.big{font-size:23px;font-weight:700;margin:4px 0 2px;line-height:1.3}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.todo{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 16px;min-height:54px}
.today .todo+.todo,.today .th+.todo{border-top:1px solid var(--line)}
.todo input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.todo label{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.todo.done .tt{color:var(--muted);text-decoration:line-through}
.todo .wlink{flex:none}
.del2{flex:none;width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1}
.tq{display:flex;gap:8px;padding:8px 12px 12px 16px;border-top:1px solid var(--line)}
.tq input{flex:1;min-width:0;border:0;border-radius:10px;background:var(--chip);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;min-height:44px}
.tabbtn{border:0;background:none;min-height:52px;font-size:11px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabbtn[aria-current="page"]{color:var(--accent);font-weight:700}
.map{position:relative;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);background:var(--map-bg);margin-top:2px}
#msvg{display:block;width:100%;max-width:100%;aspect-ratio:1/1.05;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.m-bg{fill:var(--map-bg)}
.m-campus{fill:var(--m-campus)}
.m-green{fill:var(--m-green)}
.m-wood{fill:var(--m-wood)}
.m-farm{fill:var(--m-farm)}
.m-water{fill:var(--water)}
.m-pitch{fill:var(--m-pitch)}
.m-bldg{fill:var(--m-bldg);stroke:var(--m-bldg-e);stroke-width:1;vector-effect:non-scaling-stroke}
.m-ubldg{fill:var(--m-ubldg);stroke:var(--m-ubldg-e);stroke-width:1;vector-effect:non-scaling-stroke}
.r-edge{stroke:var(--road-edge)}
.r-medge{stroke:var(--road-major-e)}
.r-minor{stroke:var(--road)}
.r-major{stroke:var(--road-major)}
.r-water{stroke:var(--water)}
.r-foot{stroke:var(--foot);stroke-dasharray:3 3}
.r-lab{font-weight:500;fill:var(--m-label);paint-order:stroke;stroke:var(--map-bg)}
.m-bl{cursor:pointer}
.m-bl text{fill:var(--m-label);text-anchor:middle;paint-order:stroke;stroke:var(--map-bg);font-weight:500}
.m-code{font-weight:700;fill:var(--accent)}
.m-stop{fill:var(--surface);stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke}
.m-stoplab{fill:var(--muted);text-anchor:middle;font-weight:700}
.pin{cursor:pointer}
.pin circle{stroke:#ffffff;stroke-width:2;vector-effect:non-scaling-stroke}
.pin-ic{fill:none;stroke:#ffffff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pin text{fill:var(--ink);font-weight:700;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--surface)}
.pin text[text-anchor="start"]{text-anchor:start}
.pin.dot circle{stroke:#ffffff;stroke-width:1px;vector-effect:non-scaling-stroke}
.pin.on circle{stroke:var(--ink);stroke-width:3}
.mjump{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.mjump .chip{background:var(--surface);box-shadow:0 1px 3px rgba(15,20,25,.2);min-height:36px;padding:6px 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--muted)}

:root{

:root[data-ut-theme="dark"]{--bg:#000000;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#98989d;--line:rgba(84,84,88,.55);--chip:rgba(118,118,128,.26);--glass:rgba(28,28,30,.72);--glass-top:rgba(0,0,0,.62);--glass-cap:rgba(10,14,24,.45);--sh:0 1px 2px rgba(0,0,0,.5);--sh-hi:0 18px 40px rgba(0,0,0,.6)}

h2{font-weight:750;letter-spacing:-.02em;font-size:20px}
.sg-name{font-weight:800;letter-spacing:-.03em;font-size:24px}
.board .th b,.calh b,.pick .name{font-weight:750;letter-spacing:-.02em}

/* 반투명 유리 막대 */

/* 카드: 테두리 대신 그림자 */
.group,.today:not(.board),.cal,.prof{box-shadow:var(--sh);background:var(--surface);border-radius:18px}
.group>*+*{border-top:.5px solid var(--line)}
.board{border-radius:20px;box-shadow:var(--sh-hi);background:linear-gradient(180deg,#14284a,var(--board))}
.qi{border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.25)}
.pick,.dday{box-shadow:var(--sh-hi)}
.chip{background:var(--chip);font-weight:600;transition:background .25s var(--ease),color .25s var(--ease),transform .2s var(--spring)}
.chip[aria-pressed="true"]{box-shadow:0 4px 12px color-mix(in srgb,var(--ln) 35%,transparent)}
.btn{border-radius:12px;font-weight:650;transition:transform .2s var(--spring),filter .2s}
.btn.pri{background:var(--ln);box-shadow:0 4px 14px color-mix(in srgb,var(--ln) 35%,transparent)}
.btn:active,.chip:active,.q:active,.post:active,.brow:active,.cls:active,.pick:active,.linkbar:active,.now:active,.cd:active,.copy:active,.fab:active{transform:scale(.96)}
.q,.post,.brow,.cls,.pick,.linkbar,.now,.cd,.copy,.fab{transition:transform .22s var(--spring)}
.linkbar,.now{box-shadow:var(--sh);background:var(--surface)}
.now{background:linear-gradient(135deg,color-mix(in srgb,var(--ln) 14%,var(--surface)),var(--surface))}
/* 배너 글자판: 유리 */
.hero{box-shadow:var(--sh-hi)}
.hero .ht{right:auto;max-width:calc(100% - 32px);padding:10px 14px 11px;border-radius:16px;background:var(--glass-cap);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.5)}
.hero p{max-width:none}
/* 역 이름판에 은은한 광택 */
.sign{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--ln);box-shadow:0 8px 22px color-mix(in srgb,var(--ln) 35%,transparent),inset 0 -3px 0 rgba(0,0,0,.12)}
/* 출발 안내판: 숫자 플립 */
.fl,.fc{display:inline-block;font-style:normal}
.fl{min-width:.66em;text-align:center;margin-right:1px;padding:1px 1px 2px;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,.1) 0 50%,rgba(0,0,0,.18) 50%);transform-origin:50% 50%;animation:flip .6s var(--ease) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes flip{0%{transform:rotateX(90deg);opacity:.2}60%{transform:rotateX(-12deg);opacity:1}100%{transform:rotateX(0)}}
/* 바텀시트: 유리 + 탄력 */
.sheet-bg{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadein .25s var(--ease)}
.sheet{border-radius:26px 26px 0 0;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:sheetup .42s var(--spring)}
@keyframes sheetup{from{transform:translateY(40%);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* 알림: 다이내믹 아일랜드처럼 위에서 */
.toast{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;background:#000000;color:#ffffff;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:island .45s var(--spring)}
@keyframes island{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
/* 화면 전환: 살짝 떠오르기 */
#view.enter>*{animation:rise .38s var(--ease) both}
#view.enter>*:nth-child(2){animation-delay:30ms}
#view.enter>*:nth-child(3){animation-delay:60ms}
#view.enter>*:nth-child(4){animation-delay:90ms}
#view.enter>*:nth-child(n+5){animation-delay:120ms}
@keyframes rise{from{transform:translateY(8px);opacity:.35}to{transform:none;opacity:1}}
/* ===== 목록 행, 상세 화면(옆에서 밀려 들어옴), 영업 정보 카드, 마스코트 ===== */
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;min-height:64px;border:0;background:none;text-align:left;color:var(--ink)}
.prow .chev,.brow .chev{transform:rotate(-90deg)}
.pic{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#ffffff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.pic .ic{width:19px;height:19px}
.pic.big{width:52px;height:52px;border-radius:16px}
.pic.big .ic{width:26px;height:26px}
.prow .st{max-width:30%}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.prow.ptile{flex-direction:column;justify-content:flex-start;align-items:center;gap:5px;padding:10px 6px 9px;min-height:94px;border-radius:14px;background:var(--surface);box-shadow:var(--sh);text-align:center;transition:transform .15s var(--spring)}
.prow.ptile:active{transform:scale(.95)}
.ptile .pic{width:30px;height:30px;border-radius:10px;pointer-events:none}
.ptile .pic .ic{width:16px;height:16px}
.pt-n{font-size:12.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;pointer-events:none}
.pt-s{font-size:10.5px;color:var(--ink-2,#6e6e73);line-height:1.2;pointer-events:none}
.ptile.dim .pt-n{color:var(--ink-2,#6e6e73)}
.page{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .38s var(--ease);box-shadow:-20px 0 40px rgba(0,0,0,.12)}
.page.on{transform:none}
.pg-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;background:var(--glass-top);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.pg-h b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pg-back,.pg-sp{flex:none;width:44px;height:44px}
.pg-back{border:0;background:none;color:var(--ln);display:grid;place-items:center}
.pg-back .ic{width:28px;height:28px;transform:rotate(90deg)}
.pg-c{max-width:520px;margin:0 auto;padding:14px 20px calc(40px + env(safe-area-inset-bottom,0px))}
.pg-c .group,.pg-c .hcard{margin-top:12px}
.pd-top{display:flex;gap:14px;align-items:center}
.pd-cat{font-size:13px;color:var(--muted);font-weight:600}
.pd-name{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin-top:2px}
.pd-note{font-size:16px;line-height:1.65;margin:14px 0 0;overflow-wrap:anywhere}
.pd-acts{margin-top:16px}
.hcard{background:var(--surface);border-radius:18px;box-shadow:var(--sh);padding:14px 16px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hhead b{font-size:15px}
.hpill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.hpill.on{background:var(--ok-soft);color:var(--ok)}
.htxt{margin:8px 0 0;font-size:15px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.htxt.none{color:var(--muted);font-weight:400}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.wd{text-align:center;font-size:12px;font-weight:700;padding:6px 0;border-radius:9px;background:var(--chip)}
.wd.open{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.wd.off{color:#d23c3c;text-decoration:line-through}
.wd.unk{color:var(--muted);opacity:.55}
.wd.td{box-shadow:inset 0 0 0 2px var(--ink)}
.hsrc{margin:8px 4px 0;font-size:11px;color:var(--muted)}
.lnk{border:0;background:none;color:var(--accent);font-size:11px;font-weight:700;padding:0;min-height:28px}
.trow{display:block;width:100%;text-align:left;border:0;cursor:pointer;color:var(--ink)}
.trow h3{margin:0;font-size:16px;font-weight:700}
.g4{grid-template-columns:repeat(4,1fr);margin-top:18px}
.g4 .qi{width:62px;height:62px;border-radius:20px}
.g4 .qi .ic{width:28px;height:28px}
.g4 .q{font-size:14px;font-weight:700}
.masc{display:block;overflow:visible}
.masc .bob{animation:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hero .hm{position:absolute;right:8px;bottom:2px;width:104px;height:104px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.22))}
.hero .ht{max-width:calc(100% - 124px)}
.hero h1{white-space:nowrap;font-size:27px}
.hero .bubble{right:12px;bottom:106px;border-radius:12px 12px 2px 12px}
.bubble{position:absolute;right:108px;bottom:84px;background:var(--surface);color:var(--ink);border-radius:12px 12px 2px 12px;padding:5px 10px;font-size:12px;font-weight:700;box-shadow:var(--sh);white-space:nowrap}
.av .masc{width:44px;height:44px}
.av:has(.masc){background:var(--accent-soft)}
.emp{text-align:center;color:var(--muted);padding:24px 0 8px}
.emp .masc{width:72px;height:72px;margin:0 auto 6px}
.emp p{margin:0;font-size:14px}
.pick-m{position:relative;width:96px;height:96px;margin:4px auto 6px}
.pick-m .masc{width:96px;height:96px}
.pick-m .bubble{right:auto;left:84px;bottom:62px;border-radius:12px 12px 12px 2px}
.c-riv{stroke:var(--water);stroke-width:3.5;vector-effect:non-scaling-stroke}
.c-eP{stroke:var(--road-major-e);stroke-width:5.5;vector-effect:non-scaling-stroke}
.c-P{stroke:var(--road-major);stroke-width:3.6;vector-effect:non-scaling-stroke}
.c-eS{stroke:var(--road-edge);stroke-width:4;vector-effect:non-scaling-stroke}
.c-S{stroke:var(--road);stroke-width:2.4;vector-effect:non-scaling-stroke}
.c-rail{stroke:var(--rail);stroke-width:3;vector-effect:non-scaling-stroke}
.c-rail2{stroke:var(--map-bg);stroke-width:1.4;stroke-dasharray:6 6;vector-effect:non-scaling-stroke}
.m-place{fill:var(--muted);font-weight:800;text-anchor:middle;paint-order:stroke;stroke:var(--map-bg);opacity:.85;letter-spacing:.05em}
.wheel-wrap{position:relative;width:min(280px,78vw);aspect-ratio:1;margin:16px auto 8px}
.wheel{width:100%;height:100%;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.18);will-change:transform}
.wheel svg{display:block;width:100%;height:100%}
.wheel-ptr{position:absolute;left:50%;top:-6px;z-index:2;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.wheel-hub{position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.2);display:grid;place-items:center}
.wheel-hub .masc{width:80%;height:80%}
.wheel-wrap.done .wheel-ptr{animation:ptr .5s var(--spring)}
@keyframes ptr{0%{transform:translateX(-50%) translateY(-6px)}100%{transform:translateX(-50%)}}
.pick-res{min-height:120px}
.pick{background:#ffc21a;color:#1b1b1b}
.pick .sub{color:#3a2f00;opacity:1}
.pick>.ic{border-right-color:rgba(0,0,0,.28)}
.hot{margin-top:8px}
.hot-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;min-height:58px;text-align:left;color:var(--ink)}
.hot-row+.hot-row{border-top:1px solid var(--line)}
.hot-n{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:14px;background:#ff5a36;color:#ffffff}
.hot-row:nth-child(n+2) .hot-n{background:var(--chip);color:var(--ink)}
.hot-row .name{display:block;font-weight:700;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hot-row .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.hot-row .main{min-width:0;flex:1}
.pzs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 6px}
.pz{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:0;border-radius:18px;background:var(--surface);box-shadow:var(--sh);padding:18px 16px;min-height:120px;text-align:left;color:var(--ink);transition:transform .2s var(--spring)}
.pz:active{transform:scale(.97)}
.pz:disabled{opacity:.45}
.pz-n{font-size:20px;font-weight:800}
.pz-s{font-size:13px;color:var(--ink-2,#6e6e73)}
.pz-c{margin-top:auto;font-size:13px;font-weight:700;color:var(--sign-green,#0f9d58)}
.pick-res .big{animation:rise .4s var(--spring)}
@media (prefers-reduced-motion:reduce){.page{transition:none}.masc .bob{animation:none}}
@media (prefers-reduced-motion:reduce){#view.enter>*,.fl,.sheet,.sheet-bg,.toast{animation:none}.btn:active,.chip:active,.q:active,.post:active,.brow:active,.cls:active,.pick:active,.linkbar:active,.now:active,.cd:active,.copy:active,.fab:active{transform:none}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}.h-train,.h-car,.h-car2{animation:none}.h-train{transform:translateX(110px)}.h-car{transform:translateX(250px)}.h-car2{transform:translateX(40px)}}

/* 탭 배너: 작게 */
.sign{margin-top:10px;padding:3px 4px;border-radius:13px}
.sg-side{min-height:32px;font-size:12px}
.sg-name{font-size:17px;padding:3px 14px 4px;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
.sg-sub{margin:5px 4px 0;font-size:12px}
/* 오늘 내 수업: 시간(09:00)이 줄바꿈되지 않게 */
.board .cls .t{width:auto;min-width:66px;display:inline-flex;align-items:center;white-space:nowrap}
/* 꿀팁장소 목록: 4열 */
.pgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.prow.ptile{min-height:82px;padding:8px 3px 7px;gap:4px;border-radius:12px}
.ptile .pic{width:26px;height:26px;border-radius:8px}
.ptile .pic .ic{width:14px;height:14px}
.pt-n{font-size:11.5px}
.pt-s{font-size:9.5px}
/* 홈 제목: 흰 상자 없이, 휴대폰 크기에 맞게 */
.hero .ht{background:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;padding:0!important;left:16px;top:14px}
.hero h1{font-size:23px!important;text-shadow:0 1px 2px rgba(255,255,255,.55)}
.hero p{font-size:12px;text-shadow:0 1px 2px rgba(255,255,255,.55)}
:root[data-ut-theme="dark"] .hero h1,:root[data-ut-theme="dark"] .hero p{text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hero .hm{width:76px!important;height:76px!important;right:12px;bottom:6px}
.hero .bubble{right:10px!important;bottom:84px!important;font-size:11px;padding:4px 9px}
/* 날씨 효과 */
.hero .wx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.hero .ht,.hero .hm,.hero .bubble{z-index:2}
.hero.wx-rain .wx,.hero.wx-snow .wx{background:linear-gradient(180deg,rgba(70,84,110,.32),rgba(70,84,110,.08))}
.hero.wx-cloudy .wx,.hero.wx-cold .wx{background:linear-gradient(180deg,rgba(120,132,150,.22),transparent 70%)}
.hero.wx-fog .wx{background:linear-gradient(180deg,rgba(235,240,245,.55),rgba(235,240,245,.25))}
.hero.wx-rain svg>circle,.hero.wx-snow svg>circle,.hero.wx-cloudy svg>circle,.hero.wx-fog svg>circle{opacity:0}
.wx .dr{position:absolute;top:-16px;width:1.6px;height:14px;border-radius:2px;background:linear-gradient(rgba(200,220,255,0),rgba(200,220,255,.9));transform:rotate(12deg);animation:wxrain .8s linear infinite}
@keyframes wxrain{to{transform:translate(-36px,200px) rotate(12deg)}}
.wx .sf{position:absolute;top:-8px;border-radius:50%;background:#ffffff;box-shadow:0 0 3px rgba(255,255,255,.8);animation:wxsnow 5s linear infinite}
@keyframes wxsnow{0%{transform:translate(0,0)}50%{transform:translate(10px,95px)}100%{transform:translate(-6px,190px)}}
.wx .hglow{position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,60,.75),rgba(255,140,40,.25) 45%,transparent 70%);animation:wxglow 2.4s ease-in-out infinite}
@keyframes wxglow{50%{transform:scale(1.12);opacity:.8}}
.wx .hw{position:absolute;left:-10%;width:120%;height:10px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,170,80,.22),transparent);filter:blur(2px);animation:wxheat 2.4s ease-in-out infinite}
@keyframes wxheat{0%{transform:translateY(8px) scaleX(1);opacity:0}50%{opacity:1}100%{transform:translateY(-14px) scaleX(1.05);opacity:0}}
.wx .cl{position:absolute;width:120px;height:34px;border-radius:30px;background:rgba(255,255,255,.85);box-shadow:30px -14px 0 4px rgba(255,255,255,.85),62px -4px 0 0 rgba(255,255,255,.8);animation:wxcloud 40s linear infinite}
:root[data-ut-theme="dark"] .wx .cl{background:rgba(150,160,180,.35);box-shadow:30px -14px 0 4px rgba(150,160,180,.35),62px -4px 0 0 rgba(150,160,180,.3)}
@keyframes wxcloud{from{margin-left:0}to{margin-left:140%}}
@media (prefers-reduced-motion:reduce){.wx i{animation:none!important}}
/* 옵션 버튼(칩): 배너보다 작게 */
.chips{gap:6px;padding-block:2px 8px}
.chip{min-height:30px;padding:5px 12px;font-size:12.5px}
/* 바람: 바람 줄기와 날리는 잎 */
.hero.wx-windy .wx{background:linear-gradient(180deg,rgba(150,165,185,.18),transparent 70%)}
.wx .wd{position:absolute;right:-60px;height:1.6px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:wxwind 1.2s linear infinite}
@keyframes wxwind{from{transform:translateX(0)}to{transform:translateX(-480px)}}
.wx .lf{position:absolute;right:-12px;width:7px;height:4px;border-radius:60% 0;background:#8bbf5a;animation:wxleaf 3.2s ease-in infinite}
@keyframes wxleaf{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(-200px,-14px) rotate(220deg)}100%{transform:translate(-430px,18px) rotate(520deg)}}
/* 눈 없는 겨울: 차가운 하늘빛, 바닥 서리, 반짝이는 냉기 */
.hero.wx-cold .wx{background:linear-gradient(180deg,rgba(190,215,245,.42),rgba(210,230,250,.12))}
.wx .frost{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(0deg,rgba(255,255,255,.75),rgba(235,245,255,0))}
.wx .sp{position:absolute;width:4px;height:4px;background:#ffffff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:wxsp 2.6s ease-in-out infinite;opacity:0}
@keyframes wxsp{50%{opacity:.95;transform:scale(1.6)}}
.hero.wx-cold svg>circle{opacity:.45}
/* 도시 낮·밤 (테마가 아니라 시간 기준) */
.hero.day{--hero-sky:#e6f0ff;--hero-sky2:#f7fbff;--hero-mt:#c7dcc2;--hero-mt2:#aecaa8;--hero-bd:#d9dee8;--hero-win:#b9c7e6;--hero-gd:#eef0e4}
.hero.night{--hero-sky:#0b1633;--hero-sky2:#22365f;--hero-mt:#1d3a31;--hero-mt2:#173027;--hero-bd:#2a3550;--hero-win:#ffd66b;--hero-gd:#2b313d}
.hero .h-night{display:none;fill:#ffffff}
.hero.night .h-night{display:inline}
.hero.night .h-sun{display:none}
.hero .h-moonc{fill:var(--hero-sky)}
.hero.night .h-night>circle:nth-child(n+3){animation:twinkle 3s ease-in-out infinite}
.hero.night .h-night>circle:nth-child(2n+3){animation-delay:1.4s}
@keyframes twinkle{50%{opacity:.35}}
.hero.night .h-win:nth-of-type(3n){fill:#3b4766}
.hero.night .ht h1,.hero.night .ht p{color:#f1f5ff!important;text-shadow:0 1px 3px rgba(0,0,0,.65)!important}
.hero.day .ht h1{color:#15191e!important}.hero.day .ht p{color:#4b5563!important}
.hero.night.wx-rain .wx,.hero.night.wx-snow .wx{background:linear-gradient(180deg,rgba(10,16,30,.35),rgba(10,16,30,.1))}
@media (prefers-reduced-motion:reduce){.hero .h-night>circle{animation:none!important}}
.hero.wx-rain .h-night,.hero.wx-snow .h-night,.hero.wx-cloudy .h-night,.hero.wx-fog .h-night{display:none!important}
/* 게시판 검색·키워드 */
.bq{display:flex;gap:8px;margin:4px 0 10px}

/* 시간표 끝 시간 */
.cls .t{flex-direction:column;align-items:flex-start;gap:1px}
.cls .tend{font-family:inherit;font-size:11px;color:var(--led,#ffb51f);opacity:.75;letter-spacing:0}
/* 학사 일정 점: 빨간색 */
.d-ac{background:#e5484d!important}
/* 말풍선 펄 */
.bubble.pearl{background:linear-gradient(120deg,#ffffff 0%,#fdf7ff 30%,#f1f8ff 55%,#fffaf0 80%,#ffffff 100%);background-size:220% 220%;animation:pearl 5s ease-in-out infinite;box-shadow:0 2px 10px rgba(180,160,255,.35),0 0 0 1px rgba(255,255,255,.9) inset}
@keyframes pearl{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.bubble.pearl i{position:absolute;width:7px;height:7px;background:radial-gradient(circle,#fff 0 30%,rgba(255,255,255,0) 70%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;animation:pearlsp 2.8s ease-in-out infinite;filter:drop-shadow(0 0 2px #d8c8ff)}
.bubble.pearl .sp1{top:-5px;left:10%}.bubble.pearl .sp2{bottom:-4px;right:18%;animation-delay:.9s}.bubble.pearl .sp3{top:30%;right:-5px;animation-delay:1.8s}
@keyframes pearlsp{0%,100%{opacity:0;transform:scale(.4) rotate(0)}45%{opacity:1;transform:scale(1.15) rotate(25deg)}}
:root[data-ut-theme="dark"] .bubble.pearl{background:linear-gradient(120deg,#2a2f3d,#3a3352,#2b3b52,#3d3a2c,#2a2f3d);background-size:220% 220%;color:#f5f5f7}
@media (prefers-reduced-motion:reduce){.bubble.pearl,.bubble.pearl i{animation:none}}

  function buildHrs(on,o,c,b1,b2,lo){
    var D="월화수목금토일",fmt=function(l){var out=[],i=0;while(i<l.length){var j=i;while(j+1<l.length&&l[j+1]===l[j]+1)j++;out.push(j-i>=2?D[l[i]]+"~"+D[l[j]]:j>i?D[l[i]]+"·"+D[l[j]]:D[l[i]]);i=j+1}return out.join("·")};
    var off=[0,1,2,3,4,5,6].filter(function(i){return on.indexOf(i)<0});
    var t=(on.length===7?"매일":fmt(on))+" "+o+"~"+c;if(off.length)t+=", "+fmt(off)+" 휴무";
    var ex=[];if(b1&&b2)ex.push("브레이크 "+b1+"~"+b2);if(lo)ex.push("라스트오더 "+lo);if(ex.length)t+=" ("+ex.join(", ")+")";return t;

      if(!PICK||!PICK.pos){toast("지도에서 위치를 눌러 핀을 꽂아 주세요.");return}
      var mc=modCheck(nm+" "+tp+" "+gv("ap-m"));if(mc){toast(mc);return}
      if(!profile().name){toast("닉네임을 먼저 정해 주세요. MY → 내 프로필");return}
      var apv=document.getElementById("ap-save");apv.disabled=true;
      fbLoad(function(){var FV=window.firebase.firestore.FieldValue,ts=FV.serverTimestamp(),b=FB.db.batch(),ref=FB.db.collection("places").doc();

        b.commit().then(function(){closeSheet();toast("꿀팁장소를 올렸어요. 고마워요!")},function(err){apv.disabled=false;toast(fbErr(err))})});
      return}
    if(e.target.id==="bqform"){e.preventDefault();var bqv=document.getElementById("bq").value;S.bq=bqv;countKw(bqv);var brr=document.getElementById("bres");if(brr)brr.innerHTML=boardResultsHtml(bqv);document.getElementById("bq").blur();return}
    var g=function(id){return document.getElementById(id).value.trim()};

    if(e.target.id==="profform"){e.preventDefault();var pfn=g("pf-name"),pph=PFTMP!==undefined?PFTMP:(profile().photo||"");
      if(!NICK_RE.test(pfn)){toast("닉네임은 2~12자 한글·영문·숫자로 써 주세요.");return}var pmc0=modCheck(pfn);if(pmc0){toast(pmc0);return}
      var pdone=function(){store("ut-profile",{name:pfn.trim(),photo:pph});closeSheet();toast(pfn+"님으로 저장했어요.");render()};
      if(BOARD_LIVE){var psv=document.getElementById("pf-save");psv.disabled=true;saveProfileServer(pfn.trim(),pph).then(pdone,function(err){psv.disabled=false;toast(err&&err.code==="nick-taken"?"이미 다른 사람이 쓰는 닉네임이에요. 다른 닉네임을 골라 주세요.":fbErr(err))})}else pdone();return}
    if(false){var pfn0=g("pf-name");store("ut-profile",{name:pfn0});closeSheet();toast(pfn0?pfn0+"님으로 저장했어요.":"이름을 지웠어요.");render();return}
    if(e.target.id==="goalform"){

    if(e.target.id==="postform"){

      cwb.commit().then(function(){var ci=document.getElementById("cm-text");if(ci)ci.value=""},function(err){toast(fbErr(err))});
      return;

    if(e.target.id==="todoquick"){e.preventDefault();var qt=g("tq-text");if(!qt){toast("할 일을 적어 주세요.");return}addTodo(qt,today(),"");render();return}

      for(var k=0;k<7;k++){var v=g("hf-"+k).replace(/\s+/g,"").replace("~","-");if(!v)days.push(null);else if(v==="휴무"||RNG.test(v))days.push(v);else bad=true}
